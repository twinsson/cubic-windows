[package]
name = "minecraft-launcher"
version = "0.1.0"
description = "Cubic — Linux-first Minecraft Java Edition launcher"
authors = ["twinsson"]
edition = "2021"

[lib]
name = "minecraft_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
keyring = { version = "3", features = ["linux-native"] }
open = "5"
url = "2"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
parking_lot = "0.12"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
